
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LOVE.EXE ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  background: #030303;
  color: #ff3030;
  font-family: "Courier New", monospace;
  overflow-x: hidden;
}

.screen {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  padding: 35px 10px;
}

.terminal {
  color: #ff5252;
  font-size: 12px;
  letter-spacing: 1px;
  text-align: center;
  margin-bottom: 25px;
  line-height: 1.8;
  text-shadow: 0 0 10px #ff2222;
}

.terminal span {
  display: block;
}

.heart-container {
  width: min(94vw, 760px);
  display: flex;
  flex-direction: column;
  align-items: center;
  opacity: 0;
  transition: opacity 2s ease;
  filter: drop-shadow(0 0 9px rgba(255,0,0,.5));
}

.heart-container.visible {
  opacity: 1;
}

.heart-row {
  width: var(--row-width);
  display: flex;
  justify-content: center;
  align-items: center;
  height: clamp(8px, 1.5vw, 13px);
  white-space: nowrap;
  overflow: hidden;
}

.heart-piece {
  display: block;
  flex-shrink: 0;
  width: var(--piece-width);
  overflow: hidden;
  text-align: center;
  white-space: nowrap;
  font-size: clamp(6px, 1.3vw, 11px);
  line-height: 1.1;
  color: #ff2424;
  text-shadow:
    0 0 3px #ff0000,
    0 0 7px #ff1111,
    0 0 13px #ff0000;

  opacity: 0;

  clip-path: inset(0 100% 0 0);

  transition:
    opacity 0.6s ease,
    clip-path 0.6s ease;
}
  
.heart-piece.show {
  opacity: 1;
  clip-path: inset(0 0 0 0);
}


.heart-container.beat {
  animation: heartbeat 1.8s infinite ease-in-out;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  15% { transform: scale(1.025); }
  30% { transform: scale(1); }
  45% { transform: scale(1.018); }
  60% { transform: scale(1); }
}

.final-message {
  text-align: center;
  margin-top: 35px;
  max-width: 90%;
  opacity: 0;
  transition: opacity 2s ease;
  color: #ff7777;
  text-shadow: 0 0 12px red;
  line-height: 2;
  font-size: clamp(13px, 2vw, 17px);
}

.final-message.show {
  opacity: 1;
}

.final-message h2 {
  color: #ff3333;
  margin-bottom: 12px;
  letter-spacing: 3px;
  font-size: clamp(18px, 4vw, 27px);
}

.replay {
  margin-top: 25px;
  background: transparent;
  color: #ff5555;
  border: 1px solid #b51c1c;
  padding: 11px 25px;
  font-family: inherit;
  letter-spacing: 2px;
  cursor: pointer;
  transition: .3s;
}

.replay:hover {
  background: #a00000;
  color: white;
  box-shadow: 0 0 20px red;
}

.cursor {
  display: inline-block;
  animation: blink .8s infinite;
}

@keyframes blink {
  50% { opacity: 0; }
}
</style>
</head>

<body>

<main class="screen">

  <div class="terminal" id="terminal">
    <span>LOVE.EXE — INITIALIZING...</span>
    <span id="terminalStatus">Loading something special...</span>
    <span class="cursor">_</span>
  </div>

  <div class="heart-container" id="heart"></div>

  <div class="final-message" id="finalMessage">
    <h2>LOVE.EXE — SUCCESS ❤️</h2>
    Different languages. Different words.<br>
    But my heart says only one thing...<br>
    <strong>I LOVE YOU. ALWAYS.</strong>
    <br><br>
    <small>One heart. One person. Infinite love.</small>
    <br>
    <button class="replay" onclick="startExperience()">
      REPLAY ❤️
    </button>
  </div>

</main>

<script>

// ======================================
// 1. PERSONALIZE YOUR MESSAGE HERE
// ======================================

const finalMessage = document.getElementById("finalMessage");

const languages = [
  "I LOVE YOU",
  "मैं तुमसे प्यार करती हूँ",
  "నేను నిన్ను ప్రేమిస్తున్నాను",
  "நான் உன்னை காதலிக்கிறேன்",
  "আমি তোমাকে ভালোবাসি",
  "Je t'aime",
  "Te amo",
  "사랑해",
  "愛してる",
  "我爱你",
  "Ich liebe dich",
  "Ti amo",
  "Eu te amo",
  "أحبك",
  "Я тебя люблю",
  "Seni seviyorum",
  "Σ' αγαπώ",
  "Ik hou van jou",
  "Jag älskar dig",
  "Kocham cię"
];

// ======================================
// 2. HEART SHAPE CALCULATION
// ======================================

const heart = document.getElementById("heart");
const statusText = document.getElementById("terminalStatus");

const TOTAL_ROWS = 58;
const MIN_X = -1.4;
const MAX_X = 1.4;
const SCAN_STEPS = 1400;

function isInsideHeart(x, y) {
  return Math.pow(
    x * x + y * y - 1, 3
  ) - x * x * Math.pow(y, 3) <= 0;
}

function getHeartIntervals(y) {

  const intervals = [];
  let start = null;
  const step = (MAX_X - MIN_X) / SCAN_STEPS;

  for (let i = 0; i <= SCAN_STEPS; i++) {

    const x = MIN_X + i * step;
    const inside = isInsideHeart(x, y);

    if (inside && start === null) {
      start = x;
    }

    if ((!inside || i === SCAN_STEPS) && start !== null) {
      intervals.push({
        start: start,
        end: inside ? x : x - step
      });

      start = null;
    }
  }

  return intervals;
}

// ======================================
// 3. GENERATE TEXT HEART
// ======================================

function makeHeart() {

  heart.innerHTML = "";

  const pieces = [];

  for (let rowIndex = 0; rowIndex < TOTAL_ROWS; rowIndex++) {

    const y = 1.25 - (rowIndex / (TOTAL_ROWS - 1)) * 2.3;

    const intervals = getHeartIntervals(y);

    if (!intervals.length) continue;

    const row = document.createElement("div");
    row.className = "heart-row";

    const first = intervals[0].start;
    const last = intervals[intervals.length - 1].end;
    const totalWidth = last - first;

    row.style.setProperty(
      "--row-width",
      (totalWidth / (MAX_X - MIN_X) * 100) + "%"
    );

    const phrase = languages[rowIndex % languages.length];

    let previousEnd = first;

    intervals.forEach(interval => {

      const gap = interval.start - previousEnd;

      if (gap > 0) {
        const spacer = document.createElement("div");
        spacer.style.width = (gap / totalWidth * 100) + "%";
        spacer.style.flexShrink = "0";
        row.appendChild(spacer);
      }

      const piece = document.createElement("div");
      piece.className = "heart-piece";
      piece.style.setProperty(
        "--piece-width",
        ((interval.end - interval.start) / totalWidth * 100) + "%"
      );

      piece.textContent = (phrase + "  ♥  ").repeat(15);

      row.appendChild(piece);
      pieces.push(piece);

      previousEnd = interval.end;
    });

    heart.appendChild(row);
  }

  return pieces;
}

// ======================================
// 4. SLOW CINEMATIC ANIMATION
// ======================================

let animationTimer = null;

function sleep(ms) {
  return new Promise(resolve => {
    animationTimer = setTimeout(resolve, ms);
  });
}

async function startExperience() {

  clearTimeout(animationTimer);

  heart.classList.remove("visible", "beat");
  finalMessage.classList.remove("show");

  heart.innerHTML = "";

  statusText.textContent = "Initializing heart sequence...";

  await sleep(1800);

  statusText.textContent = "Translating love into 20 languages...";

  await sleep(1800);

  const pieces = makeHeart();

  heart.classList.add("visible");

  statusText.textContent = "Building something from the heart...";

  // Reveal the heart from top to bottom.
  for (let i = 0; i < pieces.length; i++) {

    pieces[i].classList.add("show");

    // Slow, cinematic reveal
    await sleep(190);
  }

  statusText.textContent = "Heart successfully compiled ❤️";

  await sleep(1800);

  heart.classList.add("beat");
  finalMessage.classList.add("show");
}

// ======================================
// 5. START
// ======================================

window.addEventListener("load", () => {
  startExperience();
});

</script>

</body>
</html>
